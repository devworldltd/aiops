# Gitea Actions 워크플로 (GitHub Actions 호환 문법).
# 시크릿은 Gitea repo/org secrets 로 등록한다 (Settings → Actions → Secrets).
# 마켓플레이스 액션(actions/checkout·setup-java·android-actions/setup-android·
#   reactivecircus/android-emulator-runner·actions/upload-artifact·download-artifact)은
#   Gitea Actions 가 GitHub 액션을 프록시하나, self-hosted 러너에서 동작 검증이 필요하다.
#   러너에 JDK/Android SDK 등 툴체인이 선설치돼 있으면 해당 setup 액션은 생략 가능.
# $GITHUB_PATH·hashFiles()·github.* 컨텍스트는 Gitea 호환이라 그대로 사용.
name: Mobile Android CI

on:
  push:
    branches: [dev, main]
    paths: ['android/**', '.gitea/workflows/mobile-android.yml']
  pull_request:
    paths: ['android/**']

jobs:
  build-test:
    # 러너 라벨 매핑: ubuntu-latest → Gitea Linux 러너(ubuntu-latest 라벨을 러너에 등록).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradle permission
        run: chmod +x ./gradlew
        working-directory: android

      - name: Lint
        run: ./gradlew lint
        working-directory: android

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  e2e-smoke:
    # 러너 라벨 매핑: ubuntu-latest → Gitea Linux 러너.
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug }

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke/
